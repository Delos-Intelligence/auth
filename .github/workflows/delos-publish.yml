name: Publish Delos Auth

on:
  push:
    tags: ['v2.196.0-delos*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, e.g. 2.196.0-delos.1-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delos-auth-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'Delos-Intelligence/auth'
    uses: ./.github/workflows/delos-checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^2\.196\.0-delos(\.[1-9][0-9]*)?(-rc\.[1-9][0-9]*)?$ ]]; then
            echo 'Invalid Delos release version' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: RELEASE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/delos-intelligence/auth:v${{ steps.version.outputs.version }}
            ghcr.io/delos-intelligence/auth:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy by digest: ghcr.io/delos-intelligence/auth@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
